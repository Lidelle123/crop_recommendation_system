{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Recommendation Tool</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Crop Recommendation Tool</h1>
    {% if result2 %}
        <div class="prediction-result{% if has_error %} prediction-error{% endif %}" role="status" aria-live="polite">
            {{ result2 }}
        </div>
    {% endif %}
    <form action="result" method="post">
        <div class="form-row">
            <div class="form-group">
                <label for="nitrogen">Nitrogen (N):</label>
                <input type="number" id="nitrogen" name="nitrogen" value="{{ values.nitrogen }}" required placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="phosphorus">Phosphorus (P):</label>
                <input type="number" id="phosphorus" name="phosphorus" value="{{ values.phosphorus }}" required placeholder="Enter value">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="potassium">Potassium (K):</label>
                <input type="number" id="potassium" name="potassium" value="{{ values.potassium }}" required placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="temperature">Temperature (°C):</label>
                <input type="number" step="0.01" id="temperature" name="temperature" value="{{ values.temperature }}" required placeholder="Enter value">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="humidity">Humidity (%):</label>
                <input type="number" step="0.01" id="humidity" name="humidity" value="{{ values.humidity }}" required placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="ph">pH Level:</label>
                <input type="number" step="0.01" id="ph" name="ph" value="{{ values.ph }}" required placeholder="Enter value">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="rainfall">Rainfall (mm):</label>
                <input type="number" step="0.01" id="rainfall" name="rainfall" value="{{ values.rainfall }}" required placeholder="Enter value">
            </div>
            {% csrf_token %}
            <button type="submit">Get Recommendation</button>
        </div>
    </form>

    </body>
</html>
